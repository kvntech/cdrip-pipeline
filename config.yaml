# Phase 2 orchestrator config
# Paths and settings from README.md / docs/phase1-runbook.md.
# Edit these to match arch-box's actual setup before running for real.

host: arch-box
drive_device: /dev/sr0

staging_dir: "~/cd-rips/staging"
log_dir: "~/cd-rips/logs"

# NFS mount (confirmed via live test 2026-07-26):
#   fstab: 192.168.8.20:/mnt/tank/music -> /mnt/tank/music (x-systemd.automount)
# nfs_mountpoint is the ACTUAL systemd mountpoint/automount trigger path --
# this is what pre-flight checks against, since os.path.ismount() only
# returns true for the exact mountpoint, not subdirectories inside it.
nfs_mountpoint: "/mnt/tank/music"
# library_root is the subfolder inside that mount where the music library
# lives (used for building destination paths, not for the mount check).
library_root: "/mnt/tank/music/library"
cdrips_subdir: "FLAC/CDRips"

# whipper
# [VERIFY ON LIVE RIP] fill in any flags beyond `cd rip` once confirmed
# (e.g. --offset, --output-directory) from a real run.
whipper_extra_args: []

# beets
beets_config: "~/.config/beets/config.yaml"
# Known issue (README "Permissions model"): NFS Maproot=apps means beets must
# write as root. [VERIFY ON LIVE RIP] confirm `sudo beet -c <config>` is the
# form that actually reads your user config, not /root/.config/beets/.
beets_use_sudo: true

# Known issue A: RESOLVED 2026-07-27 (missing `musicbrainz` plugin + bogus
# `search_ids` config key in beets' config -- see README.md). Set to true
# only if you want a defensive reminder printed before each import.
known_issue_a_reminder: false

# Destination folder auto-detection: after beets import, this script looks
# for the most recently modified album directory under
# library_root/cdrips_subdir to suggest as the copy-log/cue destination,
# then asks you to confirm/correct it.
dest_autodetect_window_minutes: 15

# Navidrome rescan (Subsonic-compatible API). Verified working live
# 2026-07-27 via startScan/getScanStatus (scan completed cleanly: count 1144,
# folderCount 83). Credentials are NOT stored here -- this repo is public.
# Set NAVIDROME_USER / NAVIDROME_PASS in the environment before running the
# orchestrator (see .env.example). Phase 3's systemd service should load
# them via EnvironmentFile=.
navidrome:
  enabled: true
  url: "http://192.168.8.60:4533"

# Staging cleanup
prompt_before_cleanup: true
